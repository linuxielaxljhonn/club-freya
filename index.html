<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1e3533">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Club Freya & Speed Laundry · Tarjeta de fidelidad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
:root{
  --bg:#f5efe6; --paper:#fffaf3; --ink:#1d2726; --muted:#6b7472; --line:#e4dccf;
  --freya:#23968a; --freya-2:#c49a6c; --laundry:#1b80b3; --laundry-2:#5db7cc;
  --danger:#b4412f; --ok:#2f7d4f; --radius:16px;
  --serif:'Fraunces', Georgia, serif; --sans:'DM Sans', system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:460px;margin:0 auto;padding:16px 16px 48px}
.wrap.wide{max-width:980px}
h1,h2,h3{font-family:var(--serif);font-weight:700;letter-spacing:-.01em;margin:0}
h1{font-size:1.75rem;line-height:1.15}
h2{font-size:1.25rem}
h3{font-size:1.05rem}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.row{display:flex;gap:10px;align-items:center}
.row.wrapr{flex-wrap:wrap}
.spacer{flex:1}
.stack>*+*{margin-top:12px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.panel+.panel{margin-top:14px}
label.f{display:block;font-size:.85rem;font-weight:500;margin-bottom:4px;color:#3b4644}
input[type=text],input[type=email],input[type=number],input[type=password],input[type=date],select,textarea{
  width:100%;padding:11px 12px;border:1px solid #d6cdbf;border-radius:10px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--freya);box-shadow:0 0 0 3px rgba(47,107,99,.15)}
textarea{min-height:90px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.9rem}
.check input{margin-top:3px;width:18px;height:18px;flex:none;accent-color:var(--freya)}
.btn{appearance:none;border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--ink);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.block{width:100%}
.btn.freya{background:var(--freya)}
.btn.laundry{background:var(--laundry)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid #cfc5b6}
.btn.danger{background:var(--danger)}
.btn.sm{padding:8px 12px;font-size:.9rem;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pills{display:inline-flex;background:#ebe3d6;border-radius:999px;padding:3px}
.pills button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-weight:600;font-size:.85rem;cursor:pointer;color:#4a5452}
.pills button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.err{color:var(--danger);font-size:.88rem;min-height:1.2em}
.okmsg{color:var(--ok);font-size:.9rem}
.demo-bar{background:#1d2726;color:#f5efe6;font-size:.82rem;padding:8px 12px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:center}
.demo-bar a{color:#f3d58a;text-decoration:none;font-weight:600}
.demo-bar a.on{text-decoration:underline}
.brandmark{display:flex;align-items:center;gap:10px}
.marks{display:flex;gap:6px;align-items:center}
.marks img,.marks svg{width:40px;height:40px;display:block}
.marks .fm{border-radius:50%;background:#fff;border:1px solid var(--line);object-fit:cover}
.marks .sm{border-radius:10px}
.bizicon{width:18px;height:18px;vertical-align:-4px;margin-right:4px;border-radius:5px}
.bizicon.fm{border-radius:50%}
/* Tarjeta */
.card{position:relative;border-radius:22px;padding:20px;color:#fff;overflow:hidden;
  background:radial-gradient(120% 90% at 100% 100%, rgba(93,183,204,.45), transparent 55%),
             radial-gradient(90% 80% at 0% 100%, rgba(196,154,108,.40), transparent 60%),
             linear-gradient(160deg,#17625b 0%,#1d7a72 40%,#1b5f8c 100%);
  box-shadow:0 18px 40px -18px rgba(29,39,38,.55)}
.card .cardban{display:block;width:calc(100% + 40px);margin:-20px -20px 16px;height:auto}
.card .brands{background:#fff;margin:-20px -20px 16px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.card .brands .ff{height:70px;width:auto;display:block}
.card .brands svg{width:58px;height:58px;border-radius:12px;display:block}
.card .prog{font-family:var(--serif);font-size:1.15rem;font-weight:700}
.card .bizs{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;opacity:.8;margin-top:2px}
.card .qr{background:#fff;border-radius:14px;padding:10px;width:190px;height:190px;margin:18px auto 12px}
.card .qr svg{width:100%;height:100%;display:block}
.card .num{text-align:center;font-family:ui-monospace,Menlo,monospace;font-size:1.15rem;letter-spacing:.12em}
.card .holder{text-align:center;opacity:.85;font-size:.9rem;margin-top:2px}
.card .hint{text-align:center;font-size:.78rem;opacity:.7;margin-top:8px}
.wallets{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.wallet{border-radius:var(--radius);padding:14px;background:var(--paper);border:1px solid var(--line);position:relative;overflow:hidden}
.wallet:before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--c)}
.wallet .bn{font-size:.78rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--c)}
.wallet .amt{font-family:var(--serif);font-size:1.7rem;font-weight:700;margin-top:4px}
.wallet .lbl{font-size:.78rem;color:var(--muted)}
.dots{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.dots i{width:15px;height:15px;border-radius:50%;border:2px solid var(--c);display:block}
.dots i.on{background:var(--c)}
@keyframes pop{0%{transform:scale(.2);opacity:0}60%{transform:scale(1.45);opacity:1}100%{transform:scale(1)}}
@keyframes fall{0%{transform:translateY(-20px) rotate(0)}100%{transform:translateY(110vh) rotate(540deg)}}
.dots i.pop{animation:pop .7s cubic-bezier(.2,1.4,.5,1) both}
.celebrate{position:fixed;inset:0;display:grid;place-items:center;background:rgba(15,40,50,.55);z-index:70;padding:20px;overflow:hidden}
.celebrate .box{position:relative;background:#fff;border-radius:22px;padding:24px 22px;text-align:center;max-width:340px;width:100%;animation:pop .55s both;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.celebrate .big{font-family:var(--serif);font-size:2.6rem;font-weight:700;color:var(--laundry);line-height:1}
.celebrate .cf{position:absolute;top:-10px;width:9px;height:14px;border-radius:2px;animation:fall 2.6s linear forwards}
.banner{border-radius:14px;padding:12px 14px;font-weight:700;margin-top:12px;display:flex;gap:10px;align-items:center}
.banner.one{background:#fff4dc;color:#7a5410;border:1px solid #f0d79a}
.banner.gift{background:#e5f4f8;color:#155a7d;border:1px solid #b9e0eb}
.scanstamp{margin-top:10px}
.qrmodal .qrbox{background:#fff;border-radius:16px;padding:12px;width:240px;height:240px;margin:6px auto}
.qrmodal .qrbox svg{width:100%;height:100%}
.countdown{text-align:center;font-weight:700;font-size:1.1rem}
.reward{margin-top:6px;font-size:.8rem;font-weight:600;color:var(--c)}
.msg{border-left:3px solid var(--c,var(--freya));padding:8px 0 8px 12px}
.msg+.msg{border-top:1px solid var(--line)}
.msg .t{font-weight:700}
.msg .meta{font-size:.75rem;color:var(--muted)}
.badge{display:inline-block;min-width:20px;padding:1px 7px;border-radius:999px;background:var(--danger);color:#fff;font-size:.75rem;font-weight:700;text-align:center}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.72rem;font-weight:700;background:#ece4d7;color:#4a5452}
.tag.freya{background:rgba(47,107,99,.12);color:var(--freya)}
.tag.laundry{background:rgba(36,87,201,.1);color:var(--laundry)}
.tx{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:.92rem}
.tx:last-child{border-bottom:0}
.tx .plus{color:var(--ok);font-weight:700}
.tx .minus{color:var(--danger);font-weight:700}
details summary{cursor:pointer;font-weight:700;font-family:var(--serif)}
ul.rules{padding-left:18px;margin:10px 0 0}
ul.rules li{margin:4px 0}
/* Staff */
.topbar{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.tabs button{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 14px;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.kpi{display:flex;gap:10px;flex-wrap:wrap}
.kpi .k{flex:1;min-width:120px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px}
.kpi .k b{display:block;font-family:var(--serif);font-size:1.3rem}
.sum{background:#fff;border:1px dashed #cdbfa8;border-radius:12px;padding:12px;font-size:.95rem}
.sum .line{display:flex;justify-content:space-between;padding:2px 0}
.sum .line.big{font-weight:700;font-size:1.1rem;border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.tablewrap{overflow-x:auto}
.modal{position:fixed;inset:0;background:rgba(20,26,25,.6);display:grid;place-items:center;z-index:50;padding:16px}
.modal .box{background:var(--paper);border-radius:18px;padding:16px;max-width:420px;width:100%}
.modal video{width:100%;border-radius:12px;background:#000}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:90vw}
/* Cartel */
.poster{background:#fff;border-radius:22px;padding:28px;text-align:center;border:1px solid var(--line)}
.poster .plogos{display:flex;justify-content:center;align-items:center;gap:28px;margin-bottom:8px}
.poster .plogos img{height:120px}
.poster .plogos svg{width:112px;height:112px;border-radius:22px}
.poster .qrbig{width:260px;height:260px;margin:18px auto}
.poster .qrbig svg{width:100%;height:100%}
.poster .langs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px;text-align:left;font-size:.9rem}
@media (max-width:600px){.poster .langs{grid-template-columns:1fr}}
.poster .langs b{display:block;font-family:var(--serif);font-size:1rem;margin-bottom:2px}
@media print{.demo-bar,.topbar,.tabs,.noprint{display:none!important}body{background:#fff}.poster{border:0}}
</style>
</head>

/* ------------------------------ Utilidades ------------------------------ */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2 = n => Math.round((Number(n)||0) * 100) / 100;
const clone = o => JSON.parse(JSON.stringify(o));
const fill = (s, v) => s.replace(/\{(\w+)\}/g, (_, k) => v[k] ?? '');
const store = {
  get(k){ try{ return localStorage.getItem(k) }catch(e){ return memStore[k] ?? null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch(e){ memStore[k]=v } },
  del(k){ try{ localStorage.removeItem(k) }catch(e){ delete memStore[k] } },
  getJSON(k){ try{ return JSON.parse(this.get(k)) }catch(e){ return null } },
  setJSON(k,v){ this.set(k, JSON.stringify(v)) }
};
const memStore = {};
let LANG = store.get('fs_lang') || (navigator.language||'es').slice(0,2);
if (!T[LANG]) LANG = 'en';
const t = (k, v={}) => fill((T[LANG][k] ?? T.es[k] ?? k), v);
const money = (n, lang=LANG) => new Intl.NumberFormat(LOCALES[lang]||'es-ES', {style:'currency', currency:'EUR'}).format(Number(n)||0);
const moneyES = n => money(n, 'es');
const fmtDate = (ts, lang=LANG) => ts ? new Date(ts).toLocaleDateString(LOCALES[lang]||'es-ES', {day:'2-digit', month:'short', year:'numeric'}) : '—';
const fmtDT = ts => ts ? new Date(ts).toLocaleString('es-ES', {day:'2-digit', month:'2-digit', year:'2-digit', hour:'2-digit', minute:'2-digit'}) : '—';
const fmtCard = c => c ? c.replace(/^(FS)(\d{4})(\d{4})$/, '$1 $2 $3') : '';
const genCardNo = () => 'FS' + String(Math.floor(Math.random()*1e8)).padStart(8,'0');
const parseCard = s => { const m = String(s||'').toUpperCase().replace(/[\s-]/g,'').match(/FS\d{8}/); return m ? m[0] : null; };
const rid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36);
const rid2 = (n=14) => { const a = new Uint8Array(n); (crypto||window.crypto).getRandomValues(a); return [...a].map(x => 'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'[x % 56]).join(''); };
const parseToken = s => { s = String(s||''); const m = s.match(/[?&]s=([A-Za-z0-9]{8,32})/) || s.match(/^FSS:([A-Za-z0-9]{8,32})$/); return m ? m[1] : null; };
const codeErr = c => { const e = new Error(c); e.code2 = c; return e; };
const baseUrl = () => location.href.split('#')[0].split('?')[0];
const welcomeStamps = cfg => Object.fromEntries(BIZ_KEYS.map(k => [k, Math.min(1, Math.max(0, Math.round(cfg.biz[k].welcomeStamps||0)))]));
const validEmail = e => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e);
const todayISO = () => new Date().toISOString().slice(0,10);
function mergeCfg(c){
  const d = clone(DEFAULT_CONFIG); c = c || {};
  const out = {...d, ...c, biz:{}};
  for (const k of BIZ_KEYS){ out.biz[k] = {...d.biz[k], ...(c.biz?.[k]||{})}; out.biz[k].reward = {...d.biz[k].reward, ...(c.biz?.[k]?.reward||{})}; }
  return out;
}
function newCustomer(p){
  return { cardNo:p.cardNo, name:(p.name||'').trim(), email:(p.email||'').trim().toLowerCase(), lang:p.lang||'es',
    consentMkt: !!p.consentMkt, consentAt: Date.now(), createdAt: Date.now(), lastActivity: 0,
    balances:{freya:0, laundry:0}, stamps:{freya:p.stamps?.freya||0, laundry:p.stamps?.laundry||0}, welcomeGiven:{freya:false, laundry:false} };
}
function qrSvg(text, cell=5){
  if (typeof qrcode === 'undefined') return `<div style="display:grid;place-items:center;height:100%;color:#000;font-size:.8rem;text-align:center">${esc(text)}</div>`;
  const q = qrcode(0, 'M'); q.addData(text); q.make();
  return q.createSvgTag({cellSize:cell, margin:0, scalable:true});
}
function toast(msg, ms=2600){
  const d = document.createElement('div'); d.className='toast'; d.textContent = msg;
  document.body.appendChild(d); setTimeout(()=>d.remove(), ms);
}
function loadScript(src){ return new Promise((res, rej) => { const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('No se pudo cargar '+src)); document.head.appendChild(s); }); }
function applyChangeToCustomer(c, ch){
  // ch: {biz, balanceDelta, stampsDelta, setWelcome, resetAll}
  const n = clone(c);
  if (ch.resetAll){ for (const k of BIZ_KEYS){ n.balances[k]=0; n.stamps[k]=0; } }
  if (ch.biz){
    n.balances[ch.biz] = r2((n.balances[ch.biz]||0) + (ch.balanceDelta||0));
    n.stamps[ch.biz] = (n.stamps[ch.biz]||0) + (ch.stampsDelta||0);
    if (ch.setWelcome) n.welcomeGiven[ch.biz] = true;
  }
  if (n.balances[ch.biz] < -0.001 || n.stamps[ch.biz] < 0) throw new Error('Saldo o sellos insuficientes');
  if (!ch.noActivity) n.lastActivity = Date.now();
  return n;
}

    this.s.config = mergeCfg(this.s.config); this.s.tokens = this.s.tokens || {};
    this.save();

    const email = p.email.trim().toLowerCase();

  async staffLogout(){ store.del('fsclub_staff'); },
  async isStaff(){ return store.get('fsclub_staff') === '1'; },

  async getCustomer(id){ return this.s.customers[id] ? {id, ...this.s.customers[id]} : null; },
  async customers(){ this.reload(); return Object.entries(this.s.customers).map(([id,c]) => ({id, ...c})); },
  async apply(id, ch, entries){
    this.reload(); const c = this.s.customers[id]; if (!c) throw new Error('Cliente no encontrado');
    const n = applyChangeToCustomer(c, ch);

    for (const e of entries) list.unshift({id:rid(), ts:Date.now(), by:'demo', ...e});

  async messages(){ return [...this.s.messages].sort((a,b)=>b.createdAt-a.createdAt); },

  async createStampToken(biz){ this.reload(); const id = rid2(); this.s.tokens[id] = {biz, createdAt:Date.now(), expiresAt:Date.now()+TOKEN_TTL, used:false}; this.save(); return id; },
  watchToken(id, cb){ const iv = setInterval(() => { this.reload(); const tk = this.s.tokens[id]; cb(tk ? {...tk} : null); }, 700); return () => clearInterval(iv); },
  async claimStamp(id){
    this.reload();
    const me = await this.me(); if (!me) throw codeErr('nocard');
    const tk = this.s.tokens[id];
    if (!tk) throw codeErr('invalid'); if (tk.used) throw codeErr('used'); if (Date.now() > tk.expiresAt) throw codeErr('expired');
    const c = await this.apply(me.id, {biz:tk.biz, stampsDelta:1}, [{biz:tk.biz, type:'stamp', amount:1, by:'cliente'}]);
    Object.assign(this.s.tokens[id], {used:true, usedBy:me.id, usedAt:Date.now()}); this.save();
    return {customer:c, biz:tk.biz};
  },
  watchMe(cb){ const h = e => { if (e.key === this.KEY){ this.reload(); cb(); } }; window.addEventListener('storage', h); return () => window.removeEventListener('storage', h); },
  async seed(){
    const people = [
      ['Sarah Thompson','sarah.t@example.com','en',true],['Klaus Becker','k.becker@example.de','de',true],
      ['Lucía Martín','lucia.m@example.es','es',false],['James O’Neill','jamesoneill@example.com','en',true],

        title:'Massage week · −15 %', body:'Lunes a jueves, 15 % en masajes de 60 min. / Mon–Thu, 15 % off 60-min massages. / Mo–Do 15 % auf 60-Min.-Massagen.'});

        title:'Free drying on Sundays', body:'Wash with us on Sunday and your first dryer cycle is on us. Show your card at Freya next door to collect the token.'});

const FireDB = {
  async init(){
    for (const m of ['app','auth','firestore']) await loadScript(`https://www.gstatic.com/firebasejs/${FB_VERSION}/firebase-${m}-compat.js`);
    firebase.initializeApp(FIREBASE_CONFIG);
    this.auth = firebase.auth(); this.db = firebase.firestore();
    await this.auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    this.user = await new Promise(r => { const u = this.auth.onAuthStateChanged(x => { u(); r(x); }); });
    if (this.auth.isSignInWithEmailLink(location.href)){
      let email = store.get('fs_pending_email');
      if (!email) email = window.prompt('Email') || '';
      const cred = await this.auth.signInWithEmailLink(email.trim(), location.href);
      this.user = cred.user;
      history.replaceState(null, '', location.pathname + '#cliente');
    }
    const cfg = await this.db.doc('config/main').get().catch(()=>null);
    this.cfg = mergeCfg(cfg && cfg.exists ? cfg.data() : null);
    this._staff = false;
    if (this.user){ const s = await this.db.doc('staff/'+this.user.uid).get().catch(()=>null); this._staff = !!(s && s.exists); }
    if (this.user && !this._staff) await this._ensureCustomer();
  },
  async _ensureCustomer(){
    const ref = this.db.doc('customers/'+this.user.uid);
    if ((await ref.get()).exists) return;
    const p = store.getJSON('fs_pending_profile') || {};
    for (let i=0; i<6; i++){
      const cardNo = genCardNo(); const cref = this.db.doc('cards/'+cardNo);
      try{
        await this.db.runTransaction(async tr => {
          const c = await tr.get(cref); if (c.exists) throw new Error('dup');
          const ws = welcomeStamps(this.cfg);
          tr.set(cref, {uid:this.user.uid});
          tr.set(ref, newCustomer({...p, email:this.user.email, cardNo, stamps:ws}));
          for (const k of BIZ_KEYS) if (ws[k]) tr.set(ref.collection('tx').doc(), {ts:Date.now(), biz:k, type:'gift', amount:ws[k], by:'bienvenida'});
        });
        store.del('fs_pending_profile'); return;
      }catch(e){ if (e.message !== 'dup') throw e; }
    }
  },
  config(){ return this.cfg; },
  async saveConfig(c){ this.cfg = mergeCfg(c); const save = clone(this.cfg); delete save.staffPin; await this.db.doc('config/main').set(save); },
  async me(){ if (!this.user || this._staff) return null; const d = await this.db.doc('customers/'+this.user.uid).get(); return d.exists ? {id:d.id, ...d.data()} : null; },
  async _sendLink(email){
    store.set('fs_pending_email', email);
    await this.auth.sendSignInLinkToEmail(email, { url: location.origin + location.pathname, handleCodeInApp:true });
    return {pending:true, email};
  },
  async join(p){ store.setJSON('fs_pending_profile', p); return this._sendLink(p.email.trim().toLowerCase()); },
  async recover(email){ return this._sendLink(email.trim().toLowerCase()); },
  async logout(){ await this.auth.signOut(); this.user = null; this._staff = false; },
  async updateMe(f){ await this.db.doc('customers/'+this.user.uid).update(f); },
  async myTx(){ return this.txOf(this.user.uid); },
  async staffLogin(email, pass){
    const cred = await this.auth.signInWithEmailAndPassword(email, pass);
    const s = await this.db.doc('staff/'+cred.user.uid).get();
    if (!s.exists){ await this.auth.signOut(); throw new Error('Esta cuenta no está dada de alta como equipo'); }
    this.user = cred.user; this._staff = true; this.staffName = s.data().name || cred.user.email; return true;
  },
  async staffLogout(){ return this.logout(); },
  async isStaff(){ return this._staff; },
  async findCard(cardNo){
    const c = await this.db.doc('cards/'+cardNo).get(); if (!c.exists) return null;
    return this.getCustomer(c.data().uid);
  },
  async getCustomer(id){ const d = await this.db.doc('customers/'+id).get(); return d.exists ? {id:d.id, ...d.data()} : null; },
  async customers(){ const q = await this.db.collection('customers').get(); return q.docs.map(d => ({id:d.id, ...d.data()})); },
  async apply(id, ch, entries){
    const ref = this.db.doc('customers/'+id); let out;
    await this.db.runTransaction(async tr => {
      const d = await tr.get(ref); if (!d.exists) throw new Error('Cliente no encontrado');
      const n = applyChangeToCustomer(d.data(), ch);
      tr.update(ref, {balances:n.balances, stamps:n.stamps, welcomeGiven:n.welcomeGiven, lastActivity:n.lastActivity});
      for (const e of entries) tr.set(ref.collection('tx').doc(), {ts:Date.now(), by:this.staffName||this.user.email, ...e});
      out = {id, ...n};
    });
    return out;
  },
  async txOf(id){ const q = await this.db.collection('customers/'+id+'/tx').orderBy('ts','desc').limit(50).get(); return q.docs.map(d => ({id:d.id, ...d.data()})); },
  async allTx(){ const q = await this.db.collectionGroup('tx').get(); return q.docs.map(d => ({id:d.id, cid:d.ref.parent.parent.id, ...d.data()})); },
  async messages(){ const q = await this.db.collection('messages').orderBy('createdAt','desc').limit(50).get(); return q.docs.map(d => ({id:d.id, ...d.data()})); },
  async addMessage(m){ await this.db.collection('messages').add({createdAt:Date.now(), ...m}); },
  async deleteMessage(id){ await this.db.doc('messages/'+id).delete(); },
  async createStampToken(biz){
    const id = rid2();
    await this.db.doc('stampTokens/'+id).set({biz, createdAt:Date.now(), expiresAt:Date.now()+TOKEN_TTL, used:false, by:this.staffName||this.user.email});
    return id;
  },
  watchToken(id, cb){ return this.db.doc('stampTokens/'+id).onSnapshot(d => cb(d.exists ? d.data() : null), () => {}); },
  async claimStamp(id){
    if (!this.user || this._staff) throw codeErr('nocard');
    const tref = this.db.doc('stampTokens/'+id), cref = this.db.doc('customers/'+this.user.uid); let out;
    try{
      await this.db.runTransaction(async tr => {
        const t = await tr.get(tref); if (!t.exists) throw codeErr('invalid');
        const tk = t.data(); if (tk.used) throw codeErr('used'); if (Date.now() > tk.expiresAt) throw codeErr('expired');
        const c = await tr.get(cref); if (!c.exists) throw codeErr('nocard');
        const cd = c.data(), now = Date.now(); const stamps = {...cd.stamps, [tk.biz]:(cd.stamps?.[tk.biz]||0)+1};
        tr.update(tref, {used:true, usedBy:this.user.uid, usedAt:now});
        tr.update(cref, {stamps, lastActivity:now, lastToken:id});
        tr.set(cref.collection('tx').doc(), {ts:now, biz:tk.biz, type:'stamp', amount:1, by:'cliente', token:id});
        out = {customer:{id:c.id, ...cd, stamps, lastActivity:now}, biz:tk.biz};
      });
    }catch(e){ if (e.code2) throw e; if (e.code === 'permission-denied') throw codeErr('expired'); throw e; }
    return out;
  },
  watchMe(cb){
    if (!this.user || this._staff) return () => {};
    let first = true;
    return this.db.doc('customers/'+this.user.uid).onSnapshot(() => { if (first){ first = false; return; } cb(); }, () => {});
  }
};

/* ============================== LÓGICA DE NEGOCIO ============================== */
function calcPurchase(cust, biz, ticket, redeemWanted, cfg){
  const bc = cfg.biz[biz]; ticket = r2(Math.max(0, ticket));
  const bal = r2(cust.balances?.[biz] || 0);
  const maxRedeem = r2(Math.min(bal, ticket * (bc.maxRedeemPct||0) / 100));
  const redeem = r2(Math.min(Math.max(0, redeemWanted||0), maxRedeem));
  const paid = r2(ticket - redeem);
  const earn = (bc.cashbackPct > 0 && paid >= (bc.minTicket||0) && paid > 0) ? r2(paid * bc.cashbackPct / 100) : 0;
  const bonus = (earn > 0 && bc.welcomeBonus > 0 && !cust.welcomeGiven?.[biz]) ? r2(bc.welcomeBonus) : 0;
  return { ticket, bal, maxRedeem, redeem, paid, earn, bonus, newBal: r2(bal - redeem + earn + bonus) };
}
function isExpired(c, cfg){
  if (!c.lastActivity || !cfg.expiryMonths) return false;
  const lim = new Date(c.lastActivity); lim.setMonth(lim.getMonth() + Number(cfg.expiryMonths));
  return Date.now() > lim.getTime() && BIZ_KEYS.some(k => (c.balances?.[k]||0) > 0 || (c.stamps?.[k]||0) > 0);
}
function visibleMessages(msgs, cust){
  const today = todayISO();
  return msgs.filter(m => (m.lang==='all' || m.lang===cust.lang) && (!m.until || m.until >= today) && (!m.promo || cust.consentMkt));
}
function txLabel(e, lang=LANG){ return T[lang]['tx_'+e.type] || e.type; }
function txSign(e){ return ['redeem','reward','expire'].includes(e.type) ? -1 : 1; }
function txAmount(e, lang=LANG){
  if (e.type==='stamp' || e.type==='gift' || e.type==='reward' || (e.type==='expire' && e.unit==='stamps')) return (txSign(e)<0?'−':'+') + (e.amount||1) + ' ' + (lang==='es'?'sello':lang==='de'?'Stempel':'stamp') + ((e.amount||1)>1 && lang!=='de' ? 's':'');
  return (txSign(e)<0?'−':'+') + money(e.amount, lang);
}

    if (bc.stampsGoal > 0) benefits.push(t('rule_stamps',{biz:bn, n:bc.stampsGoal, reward:esc(bc.reward?.[LANG]||'')}));

      <p class="small muted" style="text-align:center;margin:4px 0 0">${t('have')} <a href="#" id="toRec">${t('recover')}</a></p>

  }
  $('#app').innerHTML = `<div class="wrap">

        <div class="sum" id="sum"></div>
        <button class="btn block ${b.cls}" id="confirmP" disabled>Confirmar</button></div>`;
    }
    if (bc.stampsGoal > 0){
      const st = c.stamps[S.biz]||0;
      html += `<div class="panel stack"><h3>Sellos · ${b.short}</h3>
        <div class="dots" style="--c:${b.color}">${Array.from({length:bc.stampsGoal},(_,i)=>`<i class="${i<st?'on':''}" style="width:22px;height:22px"></i>`).join('')}</div>
        <div class="row wrapr"><button class="btn ${b.cls}" id="addSt">+1 sello</button>

    }

    const tk = $('#tk');

      const upd = () => {
        const useB = $('#useBal').checked; $('#redWrap').hidden = !useB;
        const ticket = parseFloat(String(tk.value).replace(',','.')) || 0;
        const pre = calcPurchase(c, S.biz, ticket, Infinity, cfg);
        if (useB && $('#red').dataset.touched !== '1') $('#red').value = pre.maxRedeem.toFixed(2);
        const want = useB ? (parseFloat(String($('#red').value).replace(',','.'))||0) : 0;
        const p = calcPurchase(c, S.biz, ticket, want, cfg);
        $('#sum').innerHTML = `<div class="line"><span>Ticket</span><span>${moneyES(p.ticket)}</span></div>
          ${p.redeem?`<div class="line"><span>Saldo usado</span><span>−${moneyES(p.redeem)}</span></div>`:''}
          <div class="line big"><span>A cobrar</span><span>${moneyES(p.paid)}</span></div>
          <div class="line"><span>Cashback ${bc.cashbackPct}% ${p.paid>0 && p.paid<bc.minTicket?`(mín. ${moneyES(bc.minTicket)})`:''}</span><span>+${moneyES(p.earn)}</span></div>
          ${p.bonus?`<div class="line"><span>Regalo de bienvenida</span><span>+${moneyES(p.bonus)}</span></div>`:''}
          <div class="line"><span>Saldo después</span><span><b>${moneyES(p.newBal)}</b></span></div>`;
        $('#confirmP').disabled = !(p.ticket > 0);
        return p;
      };
      tk.oninput = upd; $('#useBal').onchange = upd; $('#red').oninput = () => { $('#red').dataset.touched='1'; upd(); };
      upd();
      $('#confirmP').onclick = async () => {
        const p = upd(); if (!(p.ticket > 0)) return;
        const entries = [];
        if (p.redeem) entries.push({biz:S.biz, type:'redeem', amount:p.redeem, ticket:p.ticket});
        if (p.earn) entries.push({biz:S.biz, type:'earn', amount:p.earn, ticket:p.ticket, paid:p.paid});
        if (p.bonus) entries.push({biz:S.biz, type:'bonus', amount:p.bonus});
        if (!entries.length) entries.push({biz:S.biz, type:'adjust', amount:0, ticket:p.ticket});
        $('#confirmP').disabled = true;
        try{
          S.cust = await DB.apply(c.id, {biz:S.biz, balanceDelta:r2(p.earn + p.bonus - p.redeem), setWelcome: p.bonus>0}, entries);
          toast(`Hecho. Cobrar ${moneyES(p.paid)} · nuevo saldo ${moneyES(S.cust.balances[S.biz])}`, 4000); draw();

    };
  }

function staffStampModal(biz, cfg, onClose){
  const m = $('#modal'); const goal = cfg.biz[biz].stampsGoal;
  m.innerHTML = `<div class="modal qrmodal"><div class="box stack">
    <div class="row"><h3>Sello · ${BIZ[biz].short}</h3><div class="spacer"></div><span class="tag ${BIZ[biz].cls}">1 uso</span></div>

    <div class="row wrapr"><button class="btn ghost sm" id="sNew">Nuevo QR</button>
      ${DEMO ? '<button class="btn ghost sm" id="sSim">Simular escaneo del cliente (demo)</button>' : ''}
      <div class="spacer"></div><button class="btn sm" id="sClose">Cerrar</button></div></div></div>`;
  let tokenId = null, exp = 0, unsub = null, done = false, timer = null;
  const fresh = async () => {
    if (unsub) unsub(); done = false;
    tokenId = await DB.createStampToken(biz); exp = Date.now() + TOKEN_TTL;
    $('#sqr').innerHTML = qrSvg(baseUrl() + '?s=' + tokenId, 5);
    $('#sqr').style.opacity = 1;
    $('#sst').innerHTML = 'Pide al cliente que lo escanee con la cámara del móvil o con el botón “Escanear QR de sello” de su tarjeta.';
    unsub = DB.watchToken(tokenId, async tk => {
      if (!tk || !tk.used || done) return;
      done = true; const c = await DB.getCustomer(tk.usedBy); const st = c?.stamps?.[biz] || 0;
      $('#sqr').style.opacity = .15; $('#scd').textContent = '';
      $('#sst').innerHTML = `<span class="okmsg" style="font-size:1.05rem;font-weight:700">✓ Sello para ${esc(c?.name||'cliente')} (${st}/${goal})</span>`
        + (st >= goal ? `<br><b>🎁 ¡Premio conseguido! Canjéalo desde Caja.</b>` : '');
    });
  };
  const tick = () => {
    if (!$('#scd')) return;
    if (done) return;
    const left = Math.max(0, Math.ceil((exp - Date.now())/1000));
    $('#scd').textContent = left ? `Caduca en ${left} s` : '';
    if (!left && tokenId) fresh();
  };
  const close = () => { clearInterval(timer); if (unsub) unsub(); m.innerHTML = ''; if (onClose) onClose(); };
  $('#sClose').onclick = close; $('#sNew').onclick = fresh;
  const sim = $('#sSim');
  if (sim) sim.onclick = async () => { try{ await DB.claimStamp(tokenId); }catch(e){ toast(e.code2 === 'nocard' ? 'Primero crea una tarjeta en “Vista cliente”' : T.es['stamp_' + (e.code2||'invalid')]); } };
  fresh().then(() => { timer = setInterval(tick, 500); tick(); });
}

/* Escáner: cámara (GitHub Pages / móvil) o foto */
async function openScanner(onCode, {validate=parseCard, title='Escanear tarjeta', camErr='La cámara no está disponible aquí (en la demo dentro de Claude está bloqueada). Usa “Foto del QR” o escribe el número.', close:closeTxt='Cerrar'} = {}){
  const m = $('#modal');
  m.innerHTML = `<div class="modal"><div class="box stack"><h3>${esc(title)}</h3><video id="vid" playsinline muted></video><canvas id="cv" hidden></canvas>
    <p class="err" id="scErr"></p><button class="btn ghost block" id="scClose">${esc(closeTxt)}</button></div></div>`;
  let stream, stop = false;
  const close = () => { stop = true; if (stream) stream.getTracks().forEach(tr=>tr.stop()); m.innerHTML=''; };
  $('#scClose').onclick = close;
  try{
    stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const v = $('#vid'); v.srcObject = stream; await v.play();
    const cv = $('#cv'), ctx = cv.getContext('2d', {willReadFrequently:true});
    const tick = () => {
      if (stop) return;
      if (v.readyState === v.HAVE_ENOUGH_DATA){
        cv.width = v.videoWidth; cv.height = v.videoHeight; ctx.drawImage(v, 0, 0);
        const img = ctx.getImageData(0, 0, cv.width, cv.height);
        const code = typeof jsQR !== 'undefined' ? jsQR(img.data, img.width, img.height) : null;
        if (code && validate(code.data)){ close(); onCode(code.data); return; }
      }
      requestAnimationFrame(tick);
    };
    tick();
  }catch(e){
    $('#scErr').textContent = camErr;
    $('#vid').hidden = true;
  }
}
function decodeImage(file){
  return new Promise(res => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, 1200 / Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width = img.width*scale; cv.height = img.height*scale;
      const ctx = cv.getContext('2d'); ctx.drawImage(img, 0, 0, cv.width, cv.height);
      const d = ctx.getImageData(0, 0, cv.width, cv.height);
      const code = typeof jsQR !== 'undefined' ? jsQR(d.data, d.width, d.height) : null;
      URL.revokeObjectURL(url); res(code ? code.data : null);
    };
    img.onerror = () => res(null); img.src = url;
  });
}

async function tabResumen(root, cfg){
  const tx = await DB.allTx();
  const now = new Date(); const ym = d => { const x = new Date(d); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0'); };
  const months = [...new Set(tx.map(e=>ym(e.ts)).concat([ym(now)]))].sort().reverse().slice(0,12);
  const agg = (k, m, type) => r2(tx.filter(e=>e.biz===k && ym(e.ts)===m && e.type===type).reduce((s,e)=>s+(Number(e.amount)||0),0));
  const cnt = (k, m, type) => tx.filter(e=>e.biz===k && ym(e.ts)===m && e.type===type).length;
  root.innerHTML = `<div class="panel stack"><h3>Resumen mensual del programa</h3>
    <p class="small muted">Cashback dado = coste del programa. Saldo usado = descuento aplicado en caja (el ticket que se declara es lo cobrado, no el importe antes del descuento; confírmalo con tu asesor).</p>
    <div class="tablewrap"><table><thead><tr><th>Mes</th>${BIZ_KEYS.map(k=>`<th>${BIZ[k].short}: cashback + regalos</th><th>${BIZ[k].short}: saldo usado</th><th>${BIZ[k].short}: sellos / premios</th>`).join('')}</tr></thead>
    <tbody>${months.map(m=>`<tr><td><b>${m}</b></td>${BIZ_KEYS.map(k=>`<td>${moneyES(agg(k,m,'earn')+agg(k,m,'bonus'))}</td><td>${moneyES(agg(k,m,'redeem'))}</td><td>${cnt(k,m,'stamp')} / ${cnt(k,m,'reward')}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
}

/* ---------- Ajustes / reglas ---------- */
async function tabAjustes(root, cfg){
  const c = clone(cfg);
  const num = (id, v, step='1') => `<input type="number" id="${id}" value="${esc(v)}" min="0" step="${step}">`;
  root.innerHTML = `<form class="stack" id="af">
    <div class="panel stack"><h3>General</h3>
      <div class="row wrapr"><div style="flex:2;min-width:220px"><label class="f" for="pn">Nombre del programa</label><input type="text" id="pn" value="${esc(c.programName)}"></div>
      <div style="flex:1;min-width:140px"><label class="f" for="ex">Caducidad (meses sin visita, 0 = nunca)</label>${num('ex', c.expiryMonths)}</div>
      ${DEMO?`<div style="flex:1;min-width:120px"><label class="f" for="pin2">PIN equipo (demo)</label><input type="text" id="pin2" value="${esc(c.staffPin)}"></div>`:''}</div></div>
    <div class="grid2">${BIZ_KEYS.map(k=>{ const b=c.biz[k]; return `<div class="panel stack"><h3><span class="tag ${BIZ[k].cls}">${BIZ[k].name}</span></h3>
      <div class="row wrapr"><div style="flex:1;min-width:120px"><label class="f">Cashback %</label>${num(k+'_cp', b.cashbackPct, '0.5')}</div>
        <div style="flex:1;min-width:120px"><label class="f">Compra mínima €</label>${num(k+'_mt', b.minTicket, '1')}</div></div>
      <div class="row wrapr"><div style="flex:1;min-width:120px"><label class="f">Máx. pagable con saldo %</label>${num(k+'_mr', b.maxRedeemPct, '5')}</div>
        <div style="flex:1;min-width:120px"><label class="f">Regalo bienvenida €</label>${num(k+'_wb', b.welcomeBonus, '0.5')}</div></div>
      <div class="row wrapr"><div style="flex:1;min-width:120px"><label class="f">Sellos para premio (0 = sin sellos)</label>${num(k+'_sg', b.stampsGoal)}</div>
        <div style="flex:1;min-width:120px"><label class="f">Sellos de regalo al darse de alta (0 o 1)</label>${num(k+'_ws', b.welcomeStamps||0)}</div></div>
      <div class="row wrapr">${['es','en','de'].map(l=>`<div style="flex:1;min-width:120px"><label class="f">Premio (${l.toUpperCase()})</label><input type="text" id="${k}_rw_${l}" value="${esc(b.reward?.[l]||'')}"></div>`).join('')}</div>
    </div>`; }).join('')}</div>
    <div class="row wrapr"><button class="btn" type="submit">Guardar reglas</button><span class="okmsg" id="aok"></span><div class="spacer"></div>
      ${DEMO?'<button class="btn danger sm" type="button" id="rst">Borrar todos los datos de la demo</button>':''}</div>
  </form>`;
  $('#af').onsubmit = async e => {
    e.preventDefault();
    const v = id => parseFloat(String($('#'+id).value).replace(',','.')) || 0;
    c.programName = $('#pn').value.trim() || DEFAULT_CONFIG.programName; c.expiryMonths = v('ex');
    if (DEMO) c.staffPin = $('#pin2').value.trim() || '1234';
    for (const k of BIZ_KEYS){
      Object.assign(c.biz[k], {cashbackPct:v(k+'_cp'), minTicket:v(k+'_mt'), maxRedeemPct:Math.min(100,v(k+'_mr')), welcomeBonus:v(k+'_wb'), stampsGoal:Math.round(v(k+'_sg')), welcomeStamps:Math.min(1, Math.round(v(k+'_ws')))});
      for (const l of ['es','en','de']) c.biz[k].reward[l] = $(`#${k}_rw_${l}`).value.trim();
    }
    await DB.saveConfig(c); $('#aok').textContent = 'Guardado ✓'; setTimeout(()=>{ const a=$('#aok'); if(a) a.textContent=''; }, 2000);
  };
  const rst = $('#rst'); if (rst) rst.onclick = async () => { if (rst.dataset.sure !== '1'){ rst.dataset.sure='1'; rst.textContent='Pulsa otra vez para confirmar'; return; } await DB.resetAll(); toast('Demo reiniciada'); render(); };
}

/* ================================ ARRANQUE ================================ */
(async () => {
  try{
    const u = new URL(location.href); const tok = u.searchParams.get('s');
    if (tok){ store.set('fs_pending_stamp', tok); u.searchParams.delete('s'); u.hash = 'cliente'; history.replaceState(null, '', u.toString()); }
  }catch(e){}
  $('#app').innerHTML = '<div class="wrap"><p class="muted">Cargando…</p></div>';
  try{ await DB.init(); }catch(e){ $('#app').innerHTML = `<div class="wrap"><div class="panel"><h2>Error</h2><p class="err">${esc(e.message)}</p></div></div>`; return; }
  // La tarjeta del cliente se actualiza sola cuando el equipo le pone un sello o saldo
  DB.watchMe(() => { if (route() === 'cliente' && !$('#modal').innerHTML) render(); });
  render();
})();
</script>
